# Always-on be-a-boss. `docker compose up -d --build` to start; it
# auto-restarts on crash or host reboot (restart: unless-stopped).
#
# Project + volume names are PINNED below so they never depend on this folder's
# name or location. Rename or move this directory freely — the container, image,
# and (critically) the state volume are found by their fixed names, so the bot's
# memory is never orphaned by a folder shuffle.
name: be-a-boss
services:
  be-a-boss:
    build: .
    image: be-a-boss
    container_name: be-a-boss
    restart: unless-stopped
    # Bound bursty builds/browser tests so the always-on agent cannot consume the
    # whole host. Override in .env for a larger workstation.
    cpus: ${BEABOSS_CPU_LIMIT:-4}
    mem_limit: ${BEABOSS_MEMORY_LIMIT:-4g}
    # Required only by the optional BEABOSS_NETWORK_LIMIT traffic shaper. The
    # entrypoint leaves networking untouched when the variable is blank/unset.
    cap_add:
      - NET_ADMIN
    env_file: .env
    environment:
      # Container-side overrides (these win over .env). Paths are INSIDE the container.
      PROJECTS_ROOT: /workspace
      STATE_DIR: /data
      AGENT_PERMISSION_MODE: bypassPermissions
      # Keep only SQLite on Docker's native filesystem. CODEX_HOME remains the
      # shared host directory so rotating OAuth credentials never diverge.
      CODEX_SQLITE_HOME: /root/.codex-sqlite
    volumes:
      # Your repos, shared with the host. On Windows this is a bind mount over the
      # WSL2 boundary — fine for edit/commit/run; hot-reload file-watching can lag.
      - "${HOST_DOCUMENTS:?set HOST_DOCUMENTS in .env — host path to your projects}:/workspace"
      # Provider auth sources. Either inactive provider may use the ignored local
      # fallback, so a Claude-only or Codex-only install needs only the matching path.
      - "${HOST_CLAUDE_DIR:-./.auth/claude}:/root/.claude"
      - "${HOST_CODEX_DIR:-./.auth/codex}:/root/.codex"
      # Keep SQLite on a native Linux filesystem; bind-mounted Windows/macOS
      # filesystems do not provide the locking guarantees Codex needs.
      - codex_state:/root/.codex-sqlite
      # Bot's own state (topic <-> session map).
      - bot_state:/data

  # Read-only observer: Telegram remains the sole command transport while browser
  # and editor views consume the same atomic organization snapshot concurrently.
  organization-dashboard:
    image: be-a-boss
    container_name: be-a-boss-dashboard
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    command: ["boss-dashboard"]
    environment:
      STATE_DIR: /data
      ORG_DASHBOARD_HOST: 0.0.0.0
      ORG_DASHBOARD_PORT: 8766
      BEABOSS_NETWORK_LIMIT: ""
      BEABOSS_NETWORK_UPLOAD_LIMIT: ""
      BEABOSS_NETWORK_DOWNLOAD_LIMIT: ""
    ports:
      - "127.0.0.1:${BEABOSS_DASHBOARD_PORT:-8766}:8766"
    volumes:
      - bot_state:/data:ro
    depends_on:
      - be-a-boss

volumes:
  bot_state:
    # Explicit name → decoupled from the project/folder. This is the line that makes
    # a rename or move safe: the state always lives in `be-a-boss_bot_state`.
    name: be-a-boss_bot_state
  codex_state:
    # Codex SQLite state, restart-proof and safe on Docker Desktop hosts where
    # SQLite cannot reliably lock a Windows/macOS bind mount.
    name: be-a-boss_codex_state
