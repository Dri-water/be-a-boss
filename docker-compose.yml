# Always-on be-a-boss. `docker compose up -d --build` to start; it
# auto-restarts on crash or host reboot (restart: unless-stopped).
#
# Project + volume names are PINNED below so they never depend on this folder's
# name or location. Rename or move this directory freely — the container, image,
# and (critically) the state volume are found by their fixed names, so the bot's
# memory is never orphaned by a folder shuffle.
name: be-a-boss
services:
  be-a-boss:
    build: .
    image: be-a-boss
    container_name: be-a-boss
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-side overrides (these win over .env). Paths are INSIDE the container.
      PROJECTS_ROOT: /workspace
      STATE_DIR: /data
      AGENT_PERMISSION_MODE: bypassPermissions
    volumes:
      # Your repos, shared with the host. On Windows this is a bind mount over the
      # WSL2 boundary — fine for edit/commit/run; hot-reload file-watching can lag.
      - "${HOST_DOCUMENTS:?set HOST_DOCUMENTS in .env — host path to your projects}:/workspace"
      # Provider auth sources. Either inactive provider may use the ignored local
      # fallback, so a Claude-only or Codex-only install needs only the matching path.
      - "${HOST_CLAUDE_DIR:-./.auth/claude}:/root/.claude"
      - "${HOST_CODEX_DIR:-./.auth/codex}:/host-agent-auth/codex:ro"
      # Keep Codex's SQLite state on a native Linux filesystem; the entrypoint
      # seeds auth/config from the read-only host directory on first use.
      - codex_state:/root/.codex
      # Bot's own state (topic <-> session map).
      - bot_state:/data

volumes:
  bot_state:
    # Explicit name → decoupled from the project/folder. This is the line that makes
    # a rename or move safe: the state always lives in `be-a-boss_bot_state`.
    name: be-a-boss_bot_state
  codex_state:
    # Provider-native Codex threads + SQLite state, restart-proof and safe on
    # Docker Desktop hosts where SQLite cannot lock a Windows/macOS bind mount.
    name: be-a-boss_codex_state
